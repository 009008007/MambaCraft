<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MambaCraft</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101413;color:#edf6e7;font:16px/1.7 -apple-system,sans-serif}.card{max-width:560px;margin:28px;padding:38px;border:1px solid #35442f;border-radius:18px;background:#19221b}h1{font-size:38px}small{color:#b1ef76;letter-spacing:3px}a{display:inline-block;background:#b1ef76;color:#172510;text-decoration:none;padding:13px 28px;border-radius:9px;font-weight:bold}p{color:#b6c4b0}code{color:#e2ebdc}</style><div class="card"><small>YOUR NEXT ADVENTURE</small><h1>MambaCraft</h1><p>初次安裝或更新：先執行同一資料夾的 <code>Start.command</code>。它會安全關閉舊 Helper 並更新 App。</p><a href="mambacraft://open">開啟啟動器 →</a><p>安裝後也可直接雙擊 <code>MambaCraft.app</code>。每次按下開啟都會核對 Helper 版本；發現舊版時會自動換成目前安裝版。關閉最後一個啟動器分頁後，Helper 會自動結束；下載工作仍在執行時會等工作完成；遊戲仍在運行時會等遊戲退出。</p><p>若沒有反應，重新執行 <code>Start.command</code>。</p></div></html>
